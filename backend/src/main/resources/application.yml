spring:
  application:
    name: loja-virtual

  datasource:
    url: jdbc:h2:mem:loja;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

n8n:
  webhook-url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook/pedido-loja}

app:
  callback-base-url: ${APP_CALLBACK_URL:http://host.docker.internal:8080}

---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/loja_virtual
    driver-class-name: org.postgresql.Driver
    username: loja
    password: loja123

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
